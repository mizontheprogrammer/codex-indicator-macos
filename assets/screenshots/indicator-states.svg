<svg xmlns="http://www.w3.org/2000/svg" width="960" height="92" viewBox="0 0 960 92" role="img" aria-labelledby="title desc">
  <title id="title">Codex Indicator status states</title>
  <desc id="desc">Compact warm-white indicators for ready, blue working, and needs-you states with usage and elapsed time.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-30%" width="120%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#19120c" flood-opacity=".18"/>
    </filter>
    <path id="conversation-link" d="M0 -5.8 C2.8 -5.8 5.2 -4 5.7 -1.4 C5.9 -.2 5.6 1 4.9 2 L2.8 .8 C3.2 .1 3.3 -.6 3 -1.3 C2.5 -2.5 1.4 -3.2 0 -3.2"/>
  </defs>
  <rect width="960" height="92" rx="18" fill="#11151a"/>

  <g filter="url(#shadow)">
    <rect x="16" y="16" width="298" height="60" rx="30" fill="#fcfbf8" stroke="#d8d3cb"/>
    <circle cx="42" cy="46" r="12" fill="#2faf72" opacity=".12"/>
    <circle cx="42" cy="46" r="4.2" fill="#2faf72"/>
    <text x="62" y="42" fill="#24211e" font-family="Segoe UI Variable Text, Segoe UI, sans-serif" font-size="13" font-weight="600">Codex is ready</text>
    <text x="62" y="58" fill="#77716a" font-family="Segoe UI Variable Text, Segoe UI, sans-serif" font-size="10">82% left · resets 4:00 PM</text>
    <text x="294" y="50" text-anchor="end" fill="#77716a" font-family="Segoe UI Variable Text, Segoe UI, sans-serif" font-size="10">3m 42s</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="331" y="16" width="298" height="60" rx="30" fill="#fcfbf8" stroke="#d8d3cb"/>
    <circle cx="357" cy="46" r="12" fill="#4f7de8" opacity=".12"/>
    <g transform="translate(357 46)" fill="none" stroke="#4f7de8" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">
      <use href="#conversation-link"/>
      <use href="#conversation-link" transform="rotate(60)"/>
      <use href="#conversation-link" transform="rotate(120)"/>
      <use href="#conversation-link" transform="rotate(180)"/>
      <use href="#conversation-link" transform="rotate(240)"/>
      <use href="#conversation-link" transform="rotate(300)"/>
    </g>
    <text x="377" y="42" fill="#24211e" font-family="Segoe UI Variable Text, Segoe UI, sans-serif" font-size="13" font-weight="600">Writing code...</text>
    <text x="377" y="58" fill="#77716a" font-family="Segoe UI Variable Text, Segoe UI, sans-serif" font-size="10">68% left · resets 4:00 PM</text>
    <text x="609" y="50" text-anchor="end" fill="#77716a" font-family="Segoe UI Variable Text, Segoe UI, sans-serif" font-size="10">1m 23s</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="646" y="16" width="298" height="60" rx="30" fill="#fcfbf8" stroke="#d8d3cb"/>
    <circle cx="672" cy="46" r="12" fill="#d89b16" opacity=".14"/>
    <circle cx="672" cy="46" r="4.8" fill="#d89b16"/>
    <text x="692" y="42" fill="#24211e" font-family="Segoe UI Variable Text, Segoe UI, sans-serif" font-size="13" font-weight="600">Codex needs you</text>
    <text x="692" y="58" fill="#77716a" font-family="Segoe UI Variable Text, Segoe UI, sans-serif" font-size="10">68% left · resets 4:00 PM</text>
    <text x="924" y="50" text-anchor="end" fill="#77716a" font-family="Segoe UI Variable Text, Segoe UI, sans-serif" font-size="10">47s</text>
  </g>
</svg>
