<svg xmlns="http://www.w3.org/2000/svg" width="360" height="196" viewBox="0 0 360 196" role="img" aria-labelledby="title desc">
  <title id="title">Codex Indicator expanded session view</title>
  <desc id="desc">One expanded warm-white indicator showing blue working, ready, and needs-you Codex sessions.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#19120c" flood-opacity=".22"/>
    </filter>
    <path id="conversation-link" d="M0 -5.8 C2.8 -5.8 5.2 -4 5.7 -1.4 C5.9 -.2 5.6 1 4.9 2 L2.8 .8 C3.2 .1 3.3 -.6 3 -1.3 C2.5 -2.5 1.4 -3.2 0 -3.2"/>
  </defs>
  <rect width="360" height="196" rx="20" fill="#11151a"/>
  <g filter="url(#shadow)">
    <rect x="26" y="18" width="308" height="160" rx="22" fill="#fcfbf8" stroke="#d8d3cb"/>

    <circle cx="52" cy="48" r="11" fill="#4f7de8" opacity=".12"/>
    <g transform="translate(52 48)" fill="none" stroke="#4f7de8" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">
      <use href="#conversation-link"/>
      <use href="#conversation-link" transform="rotate(60)"/>
      <use href="#conversation-link" transform="rotate(120)"/>
      <use href="#conversation-link" transform="rotate(180)"/>
      <use href="#conversation-link" transform="rotate(240)"/>
      <use href="#conversation-link" transform="rotate(300)"/>
    </g>
    <text x="70" y="45" fill="#24211e" font-family="Segoe UI Variable Text, Segoe UI, sans-serif" font-size="13" font-weight="600">Running tests...</text>
    <text x="70" y="61" fill="#77716a" font-family="Segoe UI Variable Text, Segoe UI, sans-serif" font-size="10">68% left · resets 4:00 PM</text>
    <rect x="264" y="39" width="24" height="18" rx="9" fill="#4f7de8" opacity=".14"/>
    <text x="276" y="52" text-anchor="middle" fill="#4f7de8" font-family="Segoe UI, sans-serif" font-size="12">−</text>
    <text x="318" y="52" text-anchor="end" fill="#77716a" font-family="Segoe UI Variable Text, Segoe UI, sans-serif" font-size="10">2m 08s</text>

    <line x1="46" y1="75" x2="314" y2="75" stroke="#ebe7e1"/>
    <circle cx="52" cy="98" r="11" fill="#2faf72" opacity=".12"/>
    <circle cx="52" cy="98" r="4" fill="#2faf72"/>
    <text x="70" y="95" fill="#24211e" font-family="Segoe UI Variable Text, Segoe UI, sans-serif" font-size="13" font-weight="600">Codex is ready</text>
    <text x="70" y="111" fill="#77716a" font-family="Segoe UI Variable Text, Segoe UI, sans-serif" font-size="10">91% left · resets 4:00 PM</text>
    <text x="318" y="102" text-anchor="end" fill="#77716a" font-family="Segoe UI Variable Text, Segoe UI, sans-serif" font-size="10">5m 14s</text>

    <line x1="46" y1="125" x2="314" y2="125" stroke="#ebe7e1"/>
    <circle cx="52" cy="148" r="11" fill="#d89b16" opacity=".14"/>
    <circle cx="52" cy="148" r="4.6" fill="#d89b16"/>
    <text x="70" y="145" fill="#24211e" font-family="Segoe UI Variable Text, Segoe UI, sans-serif" font-size="13" font-weight="600">Codex needs you</text>
    <text x="70" y="161" fill="#77716a" font-family="Segoe UI Variable Text, Segoe UI, sans-serif" font-size="10">54% left · resets 4:00 PM</text>
    <text x="318" y="152" text-anchor="end" fill="#77716a" font-family="Segoe UI Variable Text, Segoe UI, sans-serif" font-size="10">32s</text>
  </g>
</svg>
