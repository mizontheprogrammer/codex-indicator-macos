name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-dev.txt

      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Test
        run: python -m pytest -q

      - name: Compile
        run: python -m compileall -q indicator.py app_metadata.py backend models packaging ui utils tests

      - name: Security scan
        run: python -m bandit -q -r indicator.py app_metadata.py backend models packaging ui utils

      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt

  package:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Build release
        run: python packaging/build_release.py

      - name: Smoke test without startup side effects
        shell: pwsh
        run: |
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          $before = (Get-ItemProperty -Path $key -Name CodexIndicator -ErrorAction SilentlyContinue).CodexIndicator
          $process = Start-Process `
            -FilePath ".\work\release-build\app-dist\CodexIndicator.exe" `
            -ArgumentList "--smoke-test" `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged smoke test failed with exit code $($process.ExitCode)"
          }
          $after = (Get-ItemProperty -Path $key -Name CodexIndicator -ErrorAction SilentlyContinue).CodexIndicator
          if ($before -ne $after) {
            throw "Smoke test changed the Windows startup entry"
          }

      - name: Verify metadata and legal bundle
        shell: pwsh
        run: |
          $app = Get-Item ".\work\release-build\app-dist\CodexIndicator.exe"
          $setup = Get-Item ".\release\CodexIndicatorSetup.exe"
          if ($app.VersionInfo.ProductVersion -ne "1.0.1") {
            throw "Unexpected app version: $($app.VersionInfo.ProductVersion)"
          }
          if ($setup.VersionInfo.ProductVersion -ne "1.0.1") {
            throw "Unexpected setup version: $($setup.VersionInfo.ProductVersion)"
          }
          $required = @(
            ".\work\release-build\Legal\LICENSES\GPL-3.0.txt",
            ".\work\release-build\Legal\LICENSES\LGPL-3.0.txt",
            ".\work\release-build\Legal\THIRD_PARTY_NOTICES.md",
            ".\release\SHA256SUMS.txt",
            ".\release\release-manifest.json"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing required release file: $path"
            }
          }

      - name: Upload preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CodexIndicator-Windows-v1.0.1
          if-no-files-found: error
          path: |
            release/CodexIndicatorSetup.exe
            release/CodexIndicator-Windows-x64.zip
            release/SHA256SUMS.txt
            release/release-manifest.json

  verify-macos:
    runs-on: macos-14
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Verify source and smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m pytest -q
          python indicator.py --smoke-test

      - name: Build native macOS release
        run: python packaging/build_macos.py

      - name: Verify accessory metadata and packaged startup
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p "$RUNNER_TEMP/codex-indicator-package"
          ditto -x -k release/macos/CodexIndicator-macOS-*.zip "$RUNNER_TEMP/codex-indicator-package"
          packaged_app="$RUNNER_TEMP/codex-indicator-package/Codex Indicator.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$packaged_app/Contents/Info.plist")" = true
          "$packaged_app/Contents/MacOS/Codex Indicator" --smoke-test
          codesign --verify --deep --strict "$packaged_app"

      - name: Upload macOS development artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CodexIndicator-macOS-${{ runner.arch }}-v1.0.1
          if-no-files-found: error
          path: |
            release/macos/*.zip
            release/macos/SHA256SUMS.txt
            release/macos/release-manifest.json
